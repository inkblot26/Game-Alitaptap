<!DOCTYPE html>
<html>
<head>
<title>Lakbay</title>

<style>

/* =========================
   BODY SETUP (PAGE BACKGROUND)
   ========================= */
body{
    margin:0; /* removes default browser spacing */
    background:#222; /* dark gray background outside the game */

    /* centers the game screen in the middle of the page */
    display:flex;
    justify-content:center;
    align-items:center;
    padding-top:20px; /* gives breathing space */
    min-height:100vh;
}

/* =========================
   GAME SCREEN (MAIN GAME AREA)
   ========================= */
#game{
    width: min(95vw, 1200px);   /* responsive width mobile + laptop limit*/
    height: min(90vh, 800px);   /* responsive height not to big on screen 700*/

    position:relative; /* allows child elements (player) to be positioned inside */
    overflow:hidden; /* prevents player from showing outside the box */
    border:4px solid black; /* visible border around game */

    /* BACKGROUND IMAGE (your chapter map) */
    background-image:url("chap1-0.png"); /* your background image */
    background-size:cover; /* scaling image to fit game box */
    background-repeat:no-repeat; /* prevents tiling */
    background-position:center; /* centers the image */
}

/* =========================
   PLAYER (MAIN CHARACTER)
   ========================= */
#mc{
    position:absolute; /* allows movement using left/bottom */

    width: 140px;  /* player width */
    height:140px; /* player height */

    background-image:url("mc.png"); /* your character image file */
    background-size: 100% 100%;       
    background-repeat:no-repeat;    /* prevents tiling */

    left:100px;  /* starting X position (horizontal) */
    bottom:100px; /* fixed height above ground */

    z-index:10; /* makes sure player appears above background */
}

</style>
</head>

<body>

<!-- =========================
     GAME CONTAINER
     ========================= -->
<div id="game">

    <!-- PLAYER BOX -->
    <div id="mc"></div>

</div>

<script>

/* =========================
   GET ELEMENTS FROM HTML
   ========================= */
const mc = document.getElementById("mc");     // player element
const game = document.getElementById("game"); // game screen

const playerSize = 140; // size of character (IMPORTANT for boundaries)

/* =========================
   PLAYER POSITION (X = left/right)
   ========================= */
let playerX = 100; // starting horizontal position
playerY = 100; // FORCE initial ground position
   
/* =========================
   PLAYER JUMP VARIABLES
   ========================= */
let playerY = 100;        // starting vertical position (bottom)
let velocityY = 0;        // upward/downward speed
let isJumping = false;    // prevents double jump

/* =========================
   DRAW PLAYER ON SCREEN
   ========================= */
function drawPlayer(){
    mc.style.left = playerX + "px";  // move left/right
    mc.style.bottom = playerY + "px"; // move up/down (jump)
}

/* =========================
   JUMP FUNCTION
   ========================= */
function jump(){
    if(isJumping) return;   // if already jumping, ignore

    isJumping = true;        // mark as jumping
    velocityY = 20;          // initial jump power (higher = higher jump)
}

/* =========================
   GAME LOOP (gravity system)
   runs many times per second
   ========================= */
function update(){

    // ensure player starts correctly on ground
    if(playerY < 100){
        playerY = 100;
    }
   
    // apply gravity (pull player down slowly)
    velocityY -= 1;

    // update vertical position
    playerY += velocityY;

    // ground collision (stop falling)
    if(playerY <= 100){
        playerY = 100;      // reset to ground level
        velocityY = 0;      // stop movement
        isJumping = false;  // allow next jump
    }

    drawPlayer();           // redraw player position

    requestAnimationFrame(update); // keep loop running
}

/* =========================
   KEYBOARD CONTROLS
   ========================= */
document.addEventListener("keydown", function(e){

    /* MOVE LEFT */
    if(e.key === "ArrowLeft"){
        playerX -= 10;
    }

    /* MOVE RIGHT */
    if(e.key === "ArrowRight"){
        playerX += 10;
    }

    /* JUMP */
    if(e.key === "ArrowUp"){
        e.preventDefault(); // stops browser scrolling
        jump(); // call jump function
    }

    /* LEFT BOUNDARY */
    if(playerX < 0){
        playerX = 0;
    }

    /* RIGHT BOUNDARY */
    if(playerX > game.clientWidth - playerSize){
        playerX = game.clientWidth - playerSize;
    }

    drawPlayer(); // update position after input
});

/* =========================
   START GAME
   ========================= */
drawPlayer(); // initial position
update();     // start gravity loop

</script>

</body>
</html>
