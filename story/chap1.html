<!DOCTYPE html>
<html>
<head>
<title>Bugtong Adventure Prototype</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    background: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

#game {
    width: 800px;
    height: 500px;
    position: relative;
    overflow: hidden;
    border: 4px solid #000;
}

/* MAP */
#map {
    position: absolute;
    top: 0;
    left: 0;
}

/* TILE */
.tile {
    width: 32px;
    height: 32px;
    position: absolute;
    background-size: cover;
}

/* PLAYER */
#player {
    width: 32px;
    height: 32px;
    background: blue;
    position: absolute;
    border: 2px solid white;
    z-index: 10;
}

</style>
</head>

<body>

<div id="game">
    <div id="map"></div>
    <div id="player"></div>
</div>

<script>

const map = document.getElementById("map");
const player = document.getElementById("player");

/* =========================
   🎮 EDIT YOUR MAP HERE
   ========================= */
const mapData = [
  ["grass","grass","grass","grass","grass","grass","grass","grass","grass","grass"],
  ["grass","grass","grass","stone","grass","grass","grass","grass","grass","grass"],
  ["grass","water","water","grass","grass","grass","tree","grass","grass","grass"],
  ["grass","grass","grass","grass","grass","grass","grass","grass","grass","grass"],
  ["grass","grass","grass","grass","grass","grass","grass","grass","grass","grass"]
];

/* TILE TEXTURES */
const tiles = {
    grass: "grasstile.png",
    stone: "/stonetile.png", // optional later
    water: "/watertile.png", // optional later
    tree: "/treetile.png"    // optional later
};

/* BUILD MAP */
function buildMap() {
    map.innerHTML = "";

    for (let y = 0; y < mapData.length; y++) {
        for (let x = 0; x < mapData[y].length; x++) {

            const tileType = mapData[y][x];

            const tile = document.createElement("div");
            tile.classList.add("tile");

            tile.style.left = (x * 32) + "px";
            tile.style.top = (y * 32) + "px";

            tile.style.backgroundImage = `url(${tiles[tileType]})`;

            map.appendChild(tile);
        }
    }
}

buildMap();

/* PLAYER POSITION */
let px = 64;
let py = 64;

function update() {
    player.style.left = px + "px";
    player.style.top = py + "px";

    requestAnimationFrame(update);
}

update();

</script>

</body>
</html>
