<!DOCTYPE html>
<html>
<head>
<title>Bugtong Adventure Prototype</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    background: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
}

/* GAME SCREEN */
#game {
    width: 800px;
    height: 500px;
    background: #7ec850;
    border: 4px solid #000;
    position: relative;
    overflow: hidden;
}

/* PLAYER */
#player {
    width: 32px;
    height: 32px;
    background: blue;
    position: absolute;
    left: 100px;
    top: 100px;
    border: 2px solid white;
    box-sizing: border-box;
}

/* CONTROLS */
#controls {
    position: absolute;
    bottom: 10px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 20px;
    box-sizing: border-box;
}

/* D-PAD */
#dpad {
    display: grid;
    grid-template-columns: 50px 50px 50px;
    grid-template-rows: 50px 50px 50px;
    gap: 5px;
}

.btn {
    background: #444;
    color: white;
    text-align: center;
    line-height: 50px;
    user-select: none;
    border-radius: 6px;
}

.btn:active {
    background: #777;
}

/* A B BUTTONS */
#ab {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.ab-btn {
    width: 60px;
    height: 60px;
    background: red;
    color: white;
    text-align: center;
    line-height: 60px;
    border-radius: 50%;
    user-select: none;
}

.ab-btn:active {
    background: darkred;
}

/* MOBILE SCALE */
@media (max-width: 850px) {
    #game {
        width: 100vw;
        height: 100vh;
        border: none;
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="player"></div>

    <!-- CONTROLS -->
    <div id="controls">

        <!-- D-PAD -->
        <div id="dpad">
            <div></div>
            <div class="btn" onmousedown="move('up')" ontouchstart="move('up')">↑</div>
            <div></div>

            <div class="btn" onmousedown="move('left')" ontouchstart="move('left')">←</div>
            <div></div>
            <div class="btn" onmousedown="move('right')" ontouchstart="move('right')">→</div>

            <div></div>
            <div class="btn" onmousedown="move('down')" ontouchstart="move('down')">↓</div>
            <div></div>
        </div>

        <!-- A B BUTTONS -->
        <div id="ab">
            <div class="ab-btn" onmousedown="action('A')" ontouchstart="action('A')">A</div>
            <div class="ab-btn" onmousedown="action('B')" ontouchstart="action('B')">B</div>
        </div>

    </div>

</div>

<script>

const player = document.getElementById("player");
const game = document.getElementById("game");

let x = 100;
let y = 100;
const speed = 4;

const keys = {};

// KEYBOARD CONTROLS
document.addEventListener("keydown", (e) => {
    keys[e.key] = true;
});

document.addEventListener("keyup", (e) => {
    keys[e.key] = false;
});

// MOBILE BUTTON CONTROL
function move(dir) {
    if (dir === "up") y -= speed * 5;
    if (dir === "down") y += speed * 5;
    if (dir === "left") x -= speed * 5;
    if (dir === "right") x += speed * 5;
}

function action(btn) {
    if (btn === "A") {
        console.log("A pressed (interact / bugtong answer)");
        alert("A BUTTON PRESSED (future bugtong interaction)");
    }
    if (btn === "B") {
        console.log("B pressed (cancel)");
        alert("B BUTTON PRESSED (back)");
    }
}

// GAME LOOP
function update() {

    if (keys["ArrowUp"]) y -= speed;
    if (keys["ArrowDown"]) y += speed;
    if (keys["ArrowLeft"]) x -= speed;
    if (keys["ArrowRight"]) x += speed;

    // boundaries
    if (x < 0) x = 0;
    if (y < 0) y = 0;

    if (x > game.clientWidth - player.clientWidth) {
        x = game.clientWidth - player.clientWidth;
    }

    if (y > game.clientHeight - player.clientHeight) {
        y = game.clientHeight - player.clientHeight;
    }

    player.style.left = x + "px";
    player.style.top = y + "px";

    requestAnimationFrame(update);
}

update();

</script>

</body>
</html>
