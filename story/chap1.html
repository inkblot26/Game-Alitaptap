<!DOCTYPE html>
<html>
<head>
<title>Simple Tile Map (10x10)</title>

<style>
body {
    margin: 0;
    background: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* GAME AREA */
#game {
    width: 640px;
    height: 640px;
    position: relative;
    background: #000;
    overflow: hidden;
}

/* MAP */
#map {
    position: absolute;
    top: 0;
    left: 0;
}

/* TILE */
.tile {
    width: 64px;
    height: 64px;
    position: absolute;

    background-image: url("tilegrass.png");
    background-size: 100% 100%;
    background-repeat: no-repeat;

    border: 1px solid rgba(0,0,0,0.3);
    box-sizing: border-box;

    image-rendering: pixelated;
}

/* MAIN CHARACTER */
#mc {
    width: 64px;
    height: 64px;
    position: absolute;

    background: blue;
    border: 2px solid white;
    box-sizing: border-box;
}
</style>
</head>

<body>

<div id="game">
    <div id="map"></div>
    <div id="mc"></div>
</div>

<script>

const map = document.getElementById("map");
const mc = document.getElementById("mc");

const tileSize = 64;

/* =========================
   🗺️ 10x10 MAP (using [])
   ========================= */
const mapData = [
["g","g","g","g","g","g","g","g","g","g"],
["g","g","g","g","g","g","g","g","g","g"],
["g","g","g","g","g","g","g","g","g","g"],
["g","g","g","g","g","g","g","g","g","g"],
["g","g","g","g","g","g","g","g","g","g"],

["g","g","g","g","g","g","g","g","g","g"],
["g","g","g","g","g","g","g","g","g","g"],
["g","g","g","g","g","g","g","g","g","g"],
["g","g","g","g","g","g","g","g","g","g"],
["g","g","g","g","g","g","g","g","g","g"]
];

/* =========================
   🧱 BUILD MAP
   ========================= */
function buildMap() {

    for (let row = 0; row < mapData.length; row++) {
        for (let col = 0; col < mapData[row].length; col++) {

            const tile = document.createElement("div");
            tile.classList.add("tile");

            tile.style.left = (col * tileSize) + "px";
            tile.style.top = (row * tileSize) + "px";

            map.appendChild(tile);
        }
    }
}

buildMap();

/* =========================
   🧍 PLACE MC (center-ish)
   ========================= */
mc.style.left = (4 * tileSize) + "px";
mc.style.top = (4 * tileSize) + "px";

</script>

</body>
</html>
