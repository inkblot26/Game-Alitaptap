<!DOCTYPE html>
<html>
<head>
<title>Lakbay</title>

<style>
body{
    margin:0;
    background:#222;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;
}

/* GAME SCREEN */
#game{
    width:900px;
    height:500px;

    background:skyblue;

    position:relative;
    overflow:hidden;

    border:4px solid black;
}

/* GROUND */
#ground{
    position:absolute;

    left:0;
    bottom:0;

    width:100%;
    height:80px;

    background:green;
}

/* PLAYER */
#mc{
    position:absolute;

    width:50px;
    height:50px;

    background:blue;

    left:100px;
    bottom:80px;
}
</style>
</head>

<body>

<div id="game">

    <div id="ground"></div>

    <div id="mc"></div>

</div>

<script>

const mc = document.getElementById("mc");

let playerX = 100;

function drawPlayer(){
    mc.style.left = playerX + "px";
}

/* KEYBOARD */
document.addEventListener("keydown", function(e){

    if(e.key === "ArrowLeft"){
        playerX -= 10;
    }

    if(e.key === "ArrowRight"){
        playerX += 10;
    }

    drawPlayer();
});

drawPlayer();

</script>

</body>
</html>
