<!DOCTYPE html>
<html>
<head>
<title>Lakbay</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
<style>

html, body {
    touch-action: manipulation;
}   
* {
    touch-action: manipulation;
}    
/* =========================
   BODY SETUP (PAGE BACKGROUND)
   ========================= */
body{
    margin:0; /* removes default browser spacing */
    background:#222; /* dark gray background outside the game */

    /* centers the game screen in the middle of the page */
    display:flex;
    justify-content:center;
    align-items:center;
    padding-top:20px; /* gives breathing space */
    min-height:100vh;
}

/* =========================
   GAME SCREEN (MAIN GAME AREA)
   ========================= */
#game{
    width: min(95vw, 1200px);   /* responsive width mobile + laptop limit*/
    height: 768px;
    transform: scale(var(--game-scale));
    transform-origin: center;

    position:relative; /* allows child elements (player) to be positioned inside */
    overflow:hidden; /* prevents player from showing outside the box */
    border:4px solid black; /* visible border around game */

    /* BACKGROUND IMAGE (your chapter map) */
    background-image:url("chap1-0.png"); /* your background image */
    background-size:cover; /* scaling image to fit game box */
    background-repeat:no-repeat; /* prevents tiling */
    background-position:center; /* centers the image */
}

/* =========================
   PLAYER (MAIN CHARACTER)
   ========================= */
#mc{
    position:absolute; /* allows movement using left/bottom */

    width: 140px;  /* player width */
    height:140px; /* player height */

    background-image:url("mc.png"); /* your character image file */
    background-size: 100% 100%;       
    background-repeat:no-repeat;    /* prevents tiling */

    left:100px;  /* starting X position (horizontal) */
    bottom:130px; /* fixed height above ground */

    z-index:10; /* makes sure player appears above background */
}

/*NCP oldman1*/   
#npc{
    position:absolute;   /* allows placing inside game */

    width:180px;         /* same size as MC (you can adjust) */
    height:180px;

    background-image:url("oldman1.png"); /* NPC image */
    background-size:100% 100%;
    background-repeat:no-repeat;

    left:900px;          /* NPC fixed position X */
    bottom:130px;        /* same ground level as MC */

    z-index:9;           /* behind MC but above background */
}

#controls{
    position:absolute;
    bottom:15px;
    left:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    padding:0 20px;
    box-sizing:border-box;
    z-index:20;
}

#controls button{
    width:80px;
    height:80px;
    font-size:30px;
    border-radius:10px;
    border:2px solid black;
    background:#444;
    color:white;
}   
#world{
    position:absolute;
    left:0;
    top:0;
    width:1408px;
    height:768px;

    background-image:url("chap1-0.png");
    background-size: cover;
    background-repeat:no-repeat;
    background-position:center;
}   
</style>
</head>

<body>

<!-- =========================
     GAME CONTAINER
     ========================= -->
<div id="game">
    <div id="world">
        <div id="mc"></div>
        <div id="npc"></div>
    </div>

    <div id="controls">

        <div style="display:flex; gap:10px;">
            <button onmousedown="moveLeft()" ontouchstart="moveLeft()">←</button>
            <button onmousedown="moveRight()" ontouchstart="moveRight()">→</button>
        </div>

        <button onclick="actionButton()" ontouchstart="actionButton()">X</button>

    </div>
</div>
   
<script>
const mc = document.getElementById("mc");
const world = document.getElementById("world");
const game = document.getElementById("game");

let playerX = 100;     // MC world position
let cameraX = 0;       // camera offset

const WORLD_WIDTH = 1408;
const SPEED = 10;

/* NPC world position */
let npcX = 500;

/* DRAW FUNCTION */
function draw(){
    // camera follows player
    cameraX = playerX - 200;

    // clamp camera so it doesn't go out of world
    if(cameraX < 0) cameraX = 0;
    if(cameraX > WORLD_WIDTH - game.clientWidth){
        cameraX = WORLD_WIDTH - game.clientWidth;
    }

    // move world (THIS is the key)
    world.style.left = -cameraX + "px";

    // place MC inside world
    mc.style.left = playerX + "px";

    // place NPC inside world
    npc.style.left = npcX + "px";
}

/* CONTROLS */
document.addEventListener("keydown", function(e){

    if(e.key === "ArrowLeft"){
        playerX -= SPEED;
    }

    if(e.key === "ArrowRight"){
        playerX += SPEED;
    }

    /* world boundaries */
    if(playerX < 0) playerX = 0;
    if(playerX > WORLD_WIDTH - 140){
        playerX = WORLD_WIDTH - 140;
    }

    draw();
});

/* BUTTONS */
function moveLeft(){
    playerX -= SPEED;
    if(playerX < 0) playerX = 0;
    draw();
}

function moveRight(){
    playerX += SPEED;
    if(playerX > WORLD_WIDTH - 140){
        playerX = WORLD_WIDTH - 140;
    }
    draw();
}

function actionButton(){
    console.log("Action button pressed!");
}    

/* INIT */
draw();

let lastTouchTime = 0;

document.addEventListener("touchstart", function (e) {
    let now = Date.now();

    if (now - lastTouchTime <= 300) {
        e.preventDefault(); // blocks double tap zoom
    }

    lastTouchTime = now;
}, { passive: false });

function fitScreen() {
    const baseWidth = 1408;
    const baseHeight = 768;

    const scale = window.innerHeight / baseHeight;

    document.documentElement.style.setProperty('--game-scale', scale);
}

window.addEventListener("resize", fitScreen);
fitScreen();
    
</script>

</body>
</html>
