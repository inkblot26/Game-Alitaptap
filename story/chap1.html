<!DOCTYPE html>
<html>
<head>
<title>Simple Tile Map (20x20)</title>

<style>
body {
    margin: 0;
    background: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* GAME AREA */
#game {
    width: 640px;
    height: 640px;
    position: relative;
    background: #000;
    overflow: hidden;
}

/* MAP */
#map {
    position: absolute;
    top: 0;
    left: 0;
}

/* TILE */
.tile {
    width: 64px;
    height: 64px;
    position: absolute;

    background-image: url("tile_grass.png");
    background-size: 100% 100%;
    background-repeat: no-repeat;

    image-rendering: pixelated;
}

/* MAIN CHARACTER */
#mc {
    width: 64px;
    height: 64px;
    position: absolute;

    background-image: url("tile_mc.png");
    background-size: 100% 100%;
    background-repeat: no-repeat;

    image-rendering: pixelated;
}
</style>
</head>

<body>

<div id="game">
    <div id="map"></div>
    <div id="mc"></div>
</div>

<script>

const map = document.getElementById("map");
const mc = document.getElementById("mc");

const tileSize = 64;

/* =========================
   🗺️ 20x20 MAP (EDIT HERE)
   ========================= */
const mapData = Array.from({ length: 20 }, () =>
    Array.from({ length: 20 }, () => "g")
);

/* =========================
   🧱 BUILD MAP
   ========================= */
function buildMap() {
    for (let row = 0; row < mapData.length; row++) {
        for (let col = 0; col < mapData[row].length; col++) {

            const tile = document.createElement("div");
            tile.classList.add("tile");

            tile.style.left = (col * tileSize) + "px";
            tile.style.top = (row * tileSize) + "px";

            map.appendChild(tile);
        }
    }
}

buildMap();

/* =========================
   🧍 MC POSITION
   ========================= */
let mcRow = 10;
let mcCol = 10;

function drawMC() {
    mc.style.left = (mcCol * tileSize) + "px";
    mc.style.top = (mcRow * tileSize) + "px";
}

drawMC();

/* =========================
   🎮 TILE MOVEMENT
   ========================= */
function moveUp() {
    if (mcRow > 0) mcRow--;
    drawMC();
}

function moveDown() {
    if (mcRow < 19) mcRow++;
    drawMC();
}

function moveLeft() {
    if (mcCol > 0) mcCol--;
    drawMC();
}

function moveRight() {
    if (mcCol < 19) mcCol++;
    drawMC();
}

/* =========================
   ⌨️ KEYBOARD SUPPORT
   ========================= */
document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowUp") moveUp();
    if (e.key === "ArrowDown") moveDown();
    if (e.key === "ArrowLeft") moveLeft();
    if (e.key === "ArrowRight") moveRight();
});

</script>

</body>
</html>
