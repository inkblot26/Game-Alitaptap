<!DOCTYPE html>
<html>
<head>
<title>Lakbay</title>

<style>

/* =========================
   BODY SETUP (PAGE BACKGROUND)
   ========================= */
body{
    margin:0; /* removes default browser spacing */
    background:#222; /* dark gray background outside the game */

    /* centers the game screen in the middle of the page */
    display:flex;
    justify-content:center;
    align-items:center;
    padding-top:20px; /* gives breathing space */
    min-height:100vh;
}

/* =========================
   GAME SCREEN (MAIN GAME AREA)
   ========================= */
#game{
    width: min(95vw, 1200px);   /* responsive width mobile + laptop limit*/
    height: min(90vh, 800px);   /* responsive height not to big on screen 700*/

    position:relative; /* allows child elements (player) to be positioned inside */
    overflow:hidden; /* prevents player from showing outside the box */
    border:4px solid black; /* visible border around game */

    /* BACKGROUND IMAGE (your chapter map) */
    background-image:url("chap1-0.png"); /* your background image */
    background-size:cover; /* scaling image to fit game box */
    background-repeat:no-repeat; /* prevents tiling */
    background-position:center; /* centers the image */
}

/* =========================
   PLAYER (MAIN CHARACTER)
   ========================= */
#mc{
    position:absolute; /* allows movement using left/bottom */

    width: 140px;  /* player width */
    height:140px; /* player height */

    background-image:url("mc.png"); /* your character image file */
    background-size: 100% 100%;       
    background-repeat:no-repeat;    /* prevents tiling */

    left:100px;  /* starting X position (horizontal) */
    bottom:100px; /* fixed height above ground */

    z-index:10; /* makes sure player appears above background */
}

/*NCP oldman1*/   
#npc{
    position:absolute;   /* allows placing inside game */

    width:180px;         /* same size as MC (you can adjust) */
    height:180px;

    background-image:url("oldman1.png"); /* NPC image */
    background-size:100% 100%;
    background-repeat:no-repeat;

    left:500px;          /* NPC fixed position X */
    bottom:100px;        /* same ground level as MC */

    z-index:9;           /* behind MC but above background */
}

#controls{
    position:absolute;
    bottom:10px;
    width:100%;
    display:flex;
    justify-content:center;
    gap:20px;
    z-index:20;
}

#controls button{
    width:80px;
    height:80px;
    font-size:30px;
    border-radius:10px;
    border:2px solid black;
    background:#444;
    color:white;
}   

#world{
    position:absolute;
    left:0;
    bottom:0;

    width:3000px; /* virtual world size (NOT image size change) */
    height:100%;

    background-image:url("chap1-0.png");
    background-size:cover;
    background-repeat:no-repeat;
    background-position:center;
}   
</style>
</head>

<body>

<!-- =========================
     GAME CONTAINER
     ========================= -->
<div id="game">
    <div id="world">
        <div id="mc"></div>
        <div id="npc"></div>
    </div>
</div>

<div id="controls">
    <button onmousedown="moveLeft()" ontouchstart="moveLeft()">←</button>
    <button onmousedown="moveRight()" ontouchstart="moveRight()">→</button>
</div>
   
<script>

/* =========================
   GET ELEMENTS FROM HTML
   ========================= */
const mc = document.getElementById("mc");     // player box
const game = document.getElementById("game"); // game screen
const playerSize = 100;
/* =========================
   PLAYER POSITION VARIABLE
   ========================= */
let worldX = 0;
const WORLD_WIDTH = 3000;

/* =========================
   FUNCTION: DRAW PLAYER
   - updates player position on screen
   ========================= */
function drawPlayer(){
    world.style.left = worldX + "px";
}

/* =========================
   KEYBOARD INPUT (CONTROLS)
   ========================= */
document.addEventListener("keydown", function(e){

    /* MOVE LEFT */
    if(e.key === "ArrowLeft"){
        worldX -= 10; // move 10px left
    }

    /* MOVE RIGHT */
    if(e.key === "ArrowRight"){
        worldX += 10; // move 10px right
    }

    /* =========================
       SCREEN BOUNDARY CHECK
       (prevents player leaving game box)
       ========================= */

    // STOP AT LEFT EDGE
    if(worldX > 0){
        worldX = 0;
    }

    // STOP AT RIGHT EDGE (end of map)
    let maxScroll = game.clientWidth - WORLD_WIDTH;
    if(worldX < maxScroll){
        worldX = maxScroll;
    }

    /* redraw player after movement */
    drawPlayer();
});

/* draw player once at start */
drawPlayer();

function moveLeft(){
    worldX += 15;
    if(worldX > 0) worldX = 0;
    drawPlayer();
}

function moveRight(){
    worldX -= 15;
    let maxScroll = game.clientWidth - WORLD_WIDTH;
    if(worldX < maxScroll){
        worldX = maxScroll;
    }

    drawPlayer();
}   
</script>

</body>
</html>
