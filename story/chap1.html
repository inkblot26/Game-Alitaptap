<!DOCTYPE html>
<html>
<head>
<title>Lakbay</title>

<style>
body{
    margin:0;
    background:#222;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;
}

/* GAME SCREEN */
#game{
    width:900px;
    height:500px;

    position:relative;
    overflow:hidden;

    border:4px solid black;

    background-image:url("chap1-0.png");
    background-size:100% 100%;
    background-repeat:no-repeat;
    background-position:center;
}

/* PLAYER */
#mc{
    position:absolute;

    width:50px;
    height:50px;

    background:blue;

    left:100px;
    bottom:50px;

    z-index:10;
}
</style>
</head>

<body>

<div id="game">

    <div id="mc"></div>

</div>

<script>

const mc = document.getElementById("mc");
const game = document.getElementById("game");

let playerX = 100;

function drawPlayer(){
    mc.style.left = playerX + "px";
}

document.addEventListener("keydown", function(e){

    if(e.key === "ArrowLeft"){
        playerX -= 10;
    }

    if(e.key === "ArrowRight"){
        playerX += 10;
    }

    // prevent leaving screen
    if(playerX < 0){
        playerX = 0;
    }

    if(playerX > game.clientWidth - 50){
        playerX = game.clientWidth - 50;
    }

    drawPlayer();
});

drawPlayer();

</script>

</body>
</html>
