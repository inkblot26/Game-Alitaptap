<!DOCTYPE html>
<html>
<head>
<title>Lakbay</title>

<!-- =========================
     MOBILE VIEW SETTINGS
     - prevents zoom / scaling issues
========================= -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">

<style>

/* =========================
   TOUCH CONTROL BEHAVIOR
   - disables browser gestures interfering with game
========================= */
html, body {
    touch-action: manipulation;
}

/* applies to everything */
* {
    touch-action: manipulation;
}

/* =========================
   BODY (OUTSIDE GAME AREA)
   ========================= */
body{
    margin:0; /* remove default spacing */
    background:#222; /* dark background outside game */

    /* center game on screen */
    display:flex;
    justify-content:center;
    align-items:center;

    padding-top:20px;
    min-height:100vh;
}

/* =========================
   GAME SCREEN (VISIBLE FRAME)
   ========================= */
#game{
    width: min(95vw, 1200px);   /* responsive width */
    height: 768px;              /* fixed game height */

    transform: scale(var(--game-scale)); /* mobile scaling system */
    transform-origin: center;             /* scale from center */

    position:relative; /* children (world, controls) use this as reference */
    overflow:hidden;   /* hides anything outside frame */

    border:4px solid black; /* game border */

    /* background (optional fallback layer) */
    background-image:url("chap1-0.png");
    background-size:cover;
    background-repeat:no-repeat;
    background-position:center;
}

/* =========================
   TOP BAR (HOME + SCORE)
========================= */
#topBar{
    position:absolute;
    top:10px;
    left:10px;

    display:flex;
    gap:10px;
    align-items:center;

    z-index:50;
}

/* same style as Tuklas mode */
.topBtn,
.topInfo{
    height:40px;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:0 14px;

    border-radius:10px;

    font-family:Georgia, serif;
    font-weight:bold;
    font-size:1rem;

    box-sizing:border-box;
}

/* Home button */
.topBtn{
    border:none;
    cursor:pointer;

    background:white;
    color:#182848;
}

/* Mystery counter */
.topInfo{
    background:rgba(255,255,255,0.95);
    color:#182848;
}     
/* =========================
   PLAYER CHARACTER (MC)
   ========================= */
#mc{
    position:absolute; /* positioned inside world */

    width:140px;
    height:140px;

    background-image:url("mc.png");
    background-size:100% 100%;
    background-repeat:no-repeat;

    left:100px;   /* X position in world */
    bottom:130px; /* ground height */

    z-index:10; /* always above background */
}

/* =========================
   NPC CHARACTER
   ========================= */
#npc{
    position:absolute;

    width:180px;
    height:180px;

    background-image:url("oldman1.png");
    background-size:100% 100%;
    background-repeat:no-repeat;

    left:900px;   /* world position */
    bottom:130px;

    z-index:9; /* behind player */
}

/* =========================
   WORLD (MOVING MAP SYSTEM)
   - this is what scrolls left/right
========================= */
#world{
    position:absolute;
    left:0;
    top:0;

    width:1408px;  /* size of your map image */
    height:768px;

    background-image:url("chap1-0.png");
    background-size:cover;
    background-repeat:no-repeat;
    background-position:center;
}

/* =========================
   CONTROLS UI (BUTTONS)
   ========================= */
#controls{
    position:absolute;
    bottom:5px;
    left:0;

    width:100%;
    display:flex;

    justify-content:space-between; /* left group + right button */

    align-items:flex-end;
    padding:0 5px;

    box-sizing:border-box;
    z-index:20;
}

/* button style */
#controls button{
    width:80px;
    height:80px;

    font-size:30px;

    border-radius:10px;
    border:2px solid black;

    background:#444;
    color:white;
    user-select: none;        /* prevents text highlight */ 
}

</style>
</head>

<body>

<!-- =========================
     GAME STRUCTURE
     ========================= -->
<div id="game">
     <!-- TOP BAR -->
     <div id="topBar">
     
         <button class="topBtn" onclick="goHome()">
             Home
         </button>
     
         <div class="topInfo" id="mysteryCounter">
             Mystery: 0
         </div>
     
     </div>

    <!-- WORLD (moves camera) -->
    <div id="world">

        <!-- player -->
        <div id="mc"></div>

        <!-- npc -->
        <div id="npc"></div>

    </div>

    <!-- CONTROLS INSIDE GAME SCREEN -->
    <div id="controls">

        <!-- LEFT: movement buttons -->
        <div style="display:flex; gap:10px;">
              <button 
                  onmousedown="moveLeftStart()" 
                  onmouseup="moveLeftEnd()" 
                  ontouchstart="moveLeftStart()" 
                  ontouchend="moveLeftEnd()">
                  ←
              </button>
          
              <button 
                  onmousedown="moveRightStart()" 
                  onmouseup="moveRightEnd()" 
                  ontouchstart="moveRightStart()" 
                  ontouchend="moveRightEnd()">
                  →
              </button>
          </div>

        <!-- RIGHT: action button -->
        <button onclick="actionButton()" ontouchstart="actionButton()">X</button>

    </div>

</div>

<script>

/* =========================
   ELEMENT REFERENCES
========================= */
const mc = document.getElementById("mc");       // player
const world = document.getElementById("world"); // map
const game = document.getElementById("game");   // screen

/* =========================
   GAME STATE VARIABLES
========================= */
let playerX = 100;   // player position in world
let cameraX = 0;     // camera offset

const WORLD_WIDTH = 1408; // map size
const SPEED = 2;         // movement speed

let npcX = 500;           // npc position in world

let moveLeftHeld = false;
let moveRightHeld = false;
let keyboardLeft = false;
let keyboardRight = false;     
     
/* =========================
   DRAW FUNCTION
   - updates everything visually
========================= */
function draw(){

    // camera follows player (center-ish view)
    cameraX = playerX - 200;

    // prevent camera going outside map (left side)
    if(cameraX < 0) cameraX = 0;

    // prevent camera going outside map (right side)
    if(cameraX > WORLD_WIDTH - game.clientWidth){
        cameraX = WORLD_WIDTH - game.clientWidth;
    }

    // move world (THIS is scrolling effect)
    world.style.left = -cameraX + "px";

    // place player inside world
    mc.style.left = playerX + "px";

    // place npc inside world
    npc.style.left = npcX + "px";
}
/* =========================
   TOPBAR CONTROLS
========================= */
function goHome(){
    window.location.href = "index.html";
}
     
/* =========================
   KEYBOARD CONTROLS
========================= */
document.addEventListener("keydown", function(e){

    if(e.key === "ArrowLeft" || e.key === "a" || e.key === "A"){
        keyboardLeft = true;
    }

    if(e.key === "ArrowRight" || e.key === "d" || e.key === "D"){
        keyboardRight = true;
    }

    if(e.key === "ArrowUp" ||e.key === "w" || e.key === "W"){
        actionButton();
    }

    // left boundary
    if(playerX < 0) playerX = 0;

    // right boundary
    if(playerX > WORLD_WIDTH - 140){
        playerX = WORLD_WIDTH - 140;
    }

    draw();
});

document.addEventListener("keyup", function(e){

    if(e.key === "ArrowLeft" || e.key === "a" || e.key === "A"){
        keyboardLeft = false;
    }

    if(e.key === "ArrowRight" || e.key === "d" || e.key === "D"){
        keyboardRight = false;
    }
});     
/* =========================
   MOBILE BUTTONS
========================= */
function moveLeftStart(){
    moveLeftHeld = true;
}

function moveLeftEnd(){
    moveLeftHeld = false;
}

function moveRightStart(){
    moveRightHeld = true;
}

function moveRightEnd(){
    moveRightHeld = false;
}

/* =========================
   ACTION BUTTON
========================= */
function actionButton(){
    console.log("Action button pressed!");
}

/* =========================
   TOUCH DOUBLE TAP FIX
   - prevents zoom on mobile
========================= */
let lastTouchTime = 0;

document.addEventListener("touchstart", function (e) {
    let now = Date.now();

    if (now - lastTouchTime <= 300) {
        e.preventDefault();
    }

    lastTouchTime = now;
}, { passive: false });

/* =========================
   SCREEN SCALING (MOBILE FIT)
========================= */
function fitScreen() {
    const baseWidth = 1408;
    const baseHeight = 768;

    const scale = window.innerHeight / baseHeight;

    document.documentElement.style.setProperty('--game-scale', scale);
}

/* run scaling on resize */
window.addEventListener("resize", fitScreen);
fitScreen();

/* initial render */
draw();

function gameLoop(){
    if(moveLeftHeld || keyboardLeft){
        playerX -= SPEED;
    }

    if(moveRightHeld || keyboardRight){
        playerX += SPEED;
    }

    // clamp left
    if(playerX < 0) playerX = 0;

    // clamp right
    if(playerX > WORLD_WIDTH - 140){
        playerX = WORLD_WIDTH - 140;
    }

    draw();

    requestAnimationFrame(gameLoop);
}

gameLoop();
     
</script>

</body>
</html>
