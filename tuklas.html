<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tuklas Mode - Alitaptap</title>

<style>
  body {
    margin: 0;
    font-family: Georgia, serif;
    height: 100vh;
    display: flex;
    flex-direction: column;

    /* 🌈 lighter kid-friendly night sky */
    background: linear-gradient(to top, #4b6cb7, #182848);
    color: white;
  }

  /* ===== TOP BAR ===== */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
  }

  .home-btn {
    background: #ffffff;
    color: #182848;
    border: none;
    padding: 10px 14px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
  }

  .timer {
    background: rgba(255,255,255,0.9);
    color: #182848;
    padding: 10px 18px;
    border-radius: 10px;
    font-weight: bold;
    font-size: 1.1rem;
  }

  /* ===== MYSTERY BOX (BIGGER) ===== */
  .mystery-container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .mystery-box {
    width: 380px;
    height: 240px;
    border: 3px dashed rgba(255,255,255,0.8);
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(255,255,255,0.1);
    border-radius: 15px;
    font-size: 1.4rem;
    text-align: center;
    padding: 10px;
  }

  /* ===== CARDS (BIGGER & FRIENDLIER) ===== */
  .cards {
    display: flex;
    justify-content: space-around;
    padding: 20px;
    background: rgba(255,255,255,0.1);
  }

  .card {
    width: 120px;
    height: 90px;
    background: #ffe08a;
    color: #2b2b2b;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    font-size: 1rem;
    transition: 0.2s;
  }

  .card:hover {
    transform: scale(1.08);
  }

  .card.done {
    background: #8affb3;
  }

  /* ===== MODAL ===== */
  .modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    display: none;
    justify-content: center;
    align-items: center;
  }

  .modal-content {
    background: white;
    color: #182848;
    padding: 25px;
    border-radius: 15px;
    width: 85%;
    max-width: 420px;
    text-align: center;
  }

  input {
    width: 90%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 1rem;
  }

  button {
    margin-top: 12px;
    padding: 12px 16px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: #4b6cb7;
    color: white;
    font-weight: bold;
    font-size: 1rem;
  }

  .feedback {
    margin-top: 10px;
    font-weight: bold;
  }

</style>
</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
  <button class="home-btn" onclick="goHome()">🏠 Home</button>
  <div class="timer" id="timer">02:00</div>
</div>

<!-- MYSTERY IMAGE -->
<div class="mystery-container">
  <div class="mystery-box">
    🔒 Mystery Image Locked<br>
    (Solve all 3 bugtong to reveal!)
  </div>
</div>

<!-- CARDS -->
<div class="cards">
  <div class="card" onclick="openCard(0)">Card 1</div>
  <div class="card" onclick="openCard(1)">Card 2</div>
  <div class="card" onclick="openCard(2)">Card 3</div>
</div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="closeModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">

    <div id="question" style="font-size:1.2rem;"></div>

    <input type="text" id="answer" placeholder="Ilagay ang sagot..." />

    <button onclick="submitAnswer()">Submit</button>

    <div class="feedback" id="feedback"></div>

  </div>
</div>

<script>

let riddles = [
  { q: "May ilaw sa gabi ngunit hindi ilaw ng bahay.", a: "alitaptap" },
  { q: "Hindi tao, hindi hayop ngunit may buntot sa tubig.", a: "bangka" },
  { q: "Bilog na pula, matamis at makatas.", a: "kamatis" }
];

let currentIndex = 0;
let solved = [false, false, false];

function openCard(index) {
  currentIndex = index;
  document.getElementById("modal").style.display = "flex";
  document.getElementById("question").innerText = riddles[index].q;
  document.getElementById("answer").value = "";
  document.getElementById("feedback").innerText = "";
}

function closeModal(e) {
  document.getElementById("modal").style.display = "none";
}

function submitAnswer() {
  let user = document.getElementById("answer").value.toLowerCase().trim();

  if (user === riddles[currentIndex].a) {
    solved[currentIndex] = true;
    document.getElementsByClassName("card")[currentIndex].classList.add("done");
    document.getElementById("feedback").innerText = "✔ Tama! Lumalakas ang liwanag.";
    checkWin();
  } else {
    document.getElementById("feedback").innerText = "✖ Subukan muli!";
  }
}

function checkWin() {
  if (solved.every(v => v)) {
    document.querySelector(".mystery-box").innerText = "✨ Mystery Revealed!";
  }
}

function goHome() {
  window.location.href = "index.html";
}

/* TIMER */
let time = 120;
setInterval(() => {
  let m = Math.floor(time / 60);
  let s = time % 60;
  document.getElementById("timer").innerText =
    `${m}:${s.toString().padStart(2,'0')}`;
  if (time > 0) time--;
}, 1000);

</script>

</body>
</html>
