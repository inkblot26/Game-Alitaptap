<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tuklas Mode - Alitaptap</title>

<style>
  body {
    margin: 0;
    font-family: Georgia, serif;
    background: linear-gradient(to top, #1b2a3a, #2f4f4f);
    color: white;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ===== TOP TIMER ===== */
  .top-bar {
    display: flex;
    justify-content: flex-end;
    padding: 10px;
  }

  .timer {
    background: rgba(0,0,0,0.5);
    padding: 8px 15px;
    border-radius: 8px;
    font-weight: bold;
  }

  /* ===== MYSTERY BOX ===== */
  .mystery-container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .mystery-box {
    width: 300px;
    height: 180px;
    border: 2px dashed white;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.2);
    border-radius: 10px;
    font-size: 1.2rem;
  }

  /* ===== CARDS ===== */
  .cards {
    display: flex;
    justify-content: space-around;
    padding: 15px;
    background: rgba(0,0,0,0.3);
  }

  .card {
    width: 90px;
    height: 60px;
    background: #ffd86b;
    color: black;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
  }

  .card:hover {
    transform: scale(1.05);
  }

  .card.done {
    background: #6bff9c;
  }

  /* ===== MODAL ===== */
  .modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    display: none;
    justify-content: center;
    align-items: center;
  }

  .modal-content {
    background: #1f2a3a;
    padding: 20px;
    border-radius: 12px;
    width: 80%;
    max-width: 400px;
    text-align: center;
  }

  input {
    width: 90%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 8px;
    border: none;
  }

  button {
    margin-top: 10px;
    padding: 10px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #ffd86b;
    font-weight: bold;
  }

  .feedback {
    margin-top: 10px;
  }

</style>
</head>

<body>

<!-- TIMER -->
<div class="top-bar">
  <div class="timer" id="timer">02:00</div>
</div>

<!-- MYSTERY IMAGE -->
<div class="mystery-container">
  <div class="mystery-box">
    🔒 Mystery Image Locked
  </div>
</div>

<!-- CARDS -->
<div class="cards">
  <div class="card" onclick="openCard(0)">Card 1</div>
  <div class="card" onclick="openCard(1)">Card 2</div>
  <div class="card" onclick="openCard(2)">Card 3</div>
</div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="closeModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">

    <div id="question">Question here</div>

    <input type="text" id="answer" placeholder="Your answer..." />

    <button onclick="submitAnswer()">Submit</button>

    <div class="feedback" id="feedback"></div>

  </div>
</div>

<script>

let riddles = [
  { q: "May ilaw sa gabi ngunit hindi ilaw ng bahay.", a: "alitaptap" },
  { q: "Hindi tao, hindi hayop ngunit may buntot sa tubig.", a: "bangka" },
  { q: "Bilog na pula, matamis at makatas.", a: "kamatis" }
];

let currentIndex = 0;
let solved = [false, false, false];

function openCard(index) {
  currentIndex = index;
  document.getElementById("modal").style.display = "flex";
  document.getElementById("question").innerText = riddles[index].q;
  document.getElementById("answer").value = "";
  document.getElementById("feedback").innerText = "";
}

function closeModal(e) {
  document.getElementById("modal").style.display = "none";
}

function submitAnswer() {
  let user = document.getElementById("answer").value.toLowerCase().trim();

  if (user === riddles[currentIndex].a) {
    solved[currentIndex] = true;
    document.getElementsByClassName("card")[currentIndex].classList.add("done");
    document.getElementById("feedback").innerText = "✔ Correct! Light is restored.";
    checkWin();
  } else {
    document.getElementById("feedback").innerText = "✖ Try again...";
  }
}

function checkWin() {
  if (solved.every(v => v)) {
    document.querySelector(".mystery-box").innerText = "✨ Mystery Revealed!";
  }
}

/* SIMPLE TIMER */
let time = 120;
setInterval(() => {
  let m = Math.floor(time / 60);
  let s = time % 60;
  document.getElementById("timer").innerText =
    `${m}:${s.toString().padStart(2,'0')}`;
  if (time > 0) time--;
}, 1000);

</script>

</body>
</html>
