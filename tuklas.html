<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Character encoding (supports special characters) -->
    <meta charset="UTF-8" />
    <!-- Character encoding (supports special characters) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!-- Browser tab title -->
    <title>Tuklas Mode - Alitaptap</title>
    
    <style>
    
    /* =====================================================
     BODY STYLE (FULL PAGE BACKGROUND + LAYOUT)
    ===================================================== */
    body {
      margin: 0;                     /* remove default spacing */
      font-family: Georgia, serif;   /* text style */
      height: 100vh;                 /* full screen height */
      display: flex;                 /* enables layout system */
      flex-direction: column;        /* stack elements vertically */
      color: white;                  /* default text color */

      /* background image for entire page */
      background-image: url("pic/tuklaspagebg.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    
    /* Dark overlay for readability */
    body::before {
      content: "";                /* required for pseudo element */
      position: fixed;            /* covers whole screen */
      inset: 0;                   /* top:0 bottom:0 left:0 right:0 */
      background: rgba(0,0,0,0.35);  /* dark transparent layer */
      z-index: 0;                /* behind UI */
    }
    
    /* Make UI elements appear above dark overlay */
    .top-bar,
    .mystery-container,
    .cards,
    .modal,
    .fail-screen {
      position: relative;
      z-index: 2;
    }
  
  /* =====================================================
     TOP BAR (HOME + TIMER + SCORE)
  ===================================================== */
    
    .top-bar {
      display: flex;                /* horizontal layout */
      justify-content: flex-start;  /* align left */
      align-items: center;          /* vertical alignment */
      padding: 15px;                /* spacing inside bar */
    }
    
    .left-controls {
      display: flex;                /* horizontal layout */
      align-items: center;          /* vertical align */
      gap: 10px;                    /* spacing between items */
    }
    
    /* Shared button + timer style */
    .home-btn,
    .timer {
      font-family: Georgia, serif;
      font-size: 1rem;
      font-weight: bold;
    
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    
      padding: 0 14px;
      border-radius: 10px;
      box-sizing: border-box;
    }
    
    /* Home button styling */
    .home-btn {
      background: #ffffff;
      color: #182848;
      border: none;
      cursor: pointer;
    }
    
    /* Timer + score box styling */
    .timer {
      background: rgba(255,255,255,0.95);
      color: #182848;
    }
    
    
    /* =====================================================
       MYSTERY AREA (MAIN GAME SECTION)
    ===================================================== */
    
    .mystery-container {
      flex: 1;                  /* take remaining space */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }
    
    /* Main clickable image box */
    .mystery-box {
      width: 380px;
      height: 240px;
      border-radius: 15px;

      /* default locked image */  
      background-image: url("pic/mysterynobg.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    
      border: 3px dashed rgba(255,255,255,0.8);
    
      display: flex;
      justify-content: center;
      align-items: center;
    
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease;    /* smooth hover animation */
    }

    /* Slight zoom effect when hovering */  
    .mystery-box:hover {
      transform: scale(1.02);
    }
    
    /* Instruction text above mystery box */
    .mystery-instruction {
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 12px;
      color: white;
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }
    
    /* Small note under text */
    .mystery-note {
      font-size: 0.85rem;
      font-weight: normal;
      opacity: 0.85;
    }
    
    /* =====================================================
     CARD SECTION (BUGTONG SELECTION)
    ===================================================== */
    
    .cards {
      display: flex;
      justify-content: space-around;
      padding: 20px;
      background: rgba(255,255,255,0.1);
    }
    
    /* Individual card */
    .card {
      width: 120px;
      height: 90px;
      background: #ffe08a;
      color: #2b2b2b;
    
      display: flex;
      justify-content: center;
      align-items: center;
    
      border-radius: 12px;
      cursor: pointer;
    
      font-weight: bold;
      font-size: 1rem;
    }
    
    /* Card when solved */
    .card.done {
      background: #8affb3;
    }
    
    /* =====================================================
     MODAL (BUGTONG QUESTION POPUP)
    ===================================================== */
    
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
    
      display: none;
      justify-content: center;
      align-items: center;
    }

    /* Modal box */  
    .modal-content {
      background: white;
      color: #182848;
    
      padding: 25px;
      border-radius: 15px;
    
      width: 85%;
      max-width: 420px;
      text-align: center;
    }

    /* Input field */  
    input {
      width: 90%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      font-size: 1rem;
    }

    /* Buttons inside modal */  
    button {
      margin-top: 0;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    
      background: #4b6cb7;
      color: white;
      font-weight: bold;
    }
    
    /* Hint layout row */
    .hint-row {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    /* Individual hint box */ 
    .hint-row span {
      background: #f2f2f2;
      color: #182848;
    
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    
    
    /* =====================================================
       FAIL SCREEN (TIME UP)
    ===================================================== */
    
    .fail-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
    
      display: none;
      justify-content: center;
      align-items: center;
    }
    
    .fail-box {
      background: white;
      color: #182848;
    
      padding: 30px;
      border-radius: 15px;
    
      text-align: center;
      width: 80%;
      max-width: 400px;
    }
    
    .fail-box h2 {
      margin-bottom: 10px;
    }
    
    .fail-buttons button {
      margin: 10px 5px 0 5px;
    }
    
    </style>
  </head>

<body>
  <!-- =====================================================
   TOP BAR (NAVIGATION + TIMER + SCORE)
  ===================================================== -->
  <div class="top-bar">
    <div class="left-controls">
      <button class="home-btn" onclick="goHome()">Home</button>          <!-- Home button -->
      <button class="home-btn" onclick="playAgain()">Play Again</button> <!-- Restart button -->
      <div class="timer" id="timer">03:00</div>                          <!-- Timer display -->
      <div id="scoreText" class="timer">Mystery: 0</div>                 <!-- Score display -->
    </div>
  </div>
  
  <!-- =====================================================
   MYSTERY AREA (MAIN GAME OBJECTIVE)
  ===================================================== -->
  <div class="mystery-container">
  
    <!-- Instruction / status message -->
    <div class="mystery-instruction" id="mysteryText">
      🔒 Mystery Image Locked<br>
      Solve 3 bugtong to reveal!
    </div>
  
    <!-- Clickable mystery image area -->
    <div class="mystery-box" onclick="openInfo()"></div>
  
    <!-- Button shown after solving current mystery -->
    <button
      id="nextGameBtn"
      class="home-btn"
      onclick="nextGame()"
      style="display:none;">
      ➡ Next Game
    </button>
  
  </div>
  
  <!-- =====================================================
   CARDS (BUGTONG SELECTION)
   - Player chooses which riddle to solve
  ===================================================== -->
  <div class="cards">
    <div class="card" onclick="openCard(this)">Card 1</div>
    <div class="card" onclick="openCard(this)">Card 2</div>
    <div class="card" onclick="openCard(this)">Card 3</div>
  </div>
  
  <!-- =====================================================
   BUGTONG MODAL (QUESTION POPUP)
  - Shows riddle, Input answer field, Hints system, Submit button
  ===================================================== -->
  <div class="modal" id="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
  
      <!-- Title -->
      <div id="bigTitle" style="font-size:28px; font-weight:bold; margin-bottom:10px;">
        BUGTONG
      </div>
  
      <!-- Question text -->
      <div id="question" style="margin-bottom:15px;"></div>
  
      <!-- Hints button -->
      <button onclick="showHints()">Show Hints</button>
  
      <!-- Hint output area -->
      <div id="hints" style="margin-top:10px;"></div>
  
      <!-- Answer input -->
      <input type="text" id="answer" placeholder="Ilagay ang sagot..." />
  
      <!-- Submit answer -->
      <button onclick="submitAnswer()">Submit</button>
  
      <!-- Feedback (correct / wrong) -->
      <div id="feedback"></div>
  
    </div>
  </div>
  
  <!-- =====================================================
   FAIL SCREEN
  - Shown when timer reaches 0, Shows restart or home options
  ===================================================== -->
  <div class="fail-screen" id="failScreen">
    <div class="fail-box">
  
      <h2>⏳ Time’s Up!</h2>
  
      <p>
        Hindi mo na natapos ang lahat, pero ayos lang!<br><br>
        Ibig sabihin nito ay marami ka pang dapat matutunan at tuklasin.
      </p>
  
      <div class="fail-buttons">
        <button onclick="goHome()">Home</button>
        <button onclick="restart()">Play Again</button>
      </div>
  
    </div>
  </div>
  
  
  <!-- =====================================================
     6. INFO MODAL (MYSTERY DETAILS)
     - Shows extra info after solving mystery
  ===================================================== -->
  <div class="modal" id="infoModal" onclick="closeInfoModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
  
      <!-- Title -->
      <h2 id="infoTitle">Information</h2>
  
      <!-- Loaded info text -->
      <div id="infoText" style="text-align:left; white-space:pre-line;"></div>
  
      <!-- Close button -->
      <button onclick="closeInfoModal()">Close</button>
  
    </div>
  </div>
  
  <script>
   /* =====================================================
     1. GAME STATE VARIABLES
     - These store all game data while running
     (VERY IMPORTANT: these change during gameplay)
  ===================================================== */
    let riddles = [];              // list of riddles loaded from file
    let currentIndex = 0;          // which card is currently selected
    let solved = [];               // tracks which riddles are solved (true/false array)
    let mysteryImage = "";         // current mystery image file
    let mysteryInfo = "";          // info text file for mystery
    let currentMysteryIndex = 0;   // which mystery number we are on (0,1,2...)
    let mysteryScore = 0;          // score (how many mysteries solved)
    let mysterySolved = false;     // true if current mystery is solved
    let totalMysteries = 33;       // total number of mysteries in game
    let hintsVisible = false;      // controls hint visibility toggle
    let time = 180;                // timer in seconds (180 = 3 minutes)
    let timerRunning = true;       // controls whether timer is running
       
  /* =====================================================
     2. LOAD BUGTONG (RIDDLES DATA)
     - Reads external text file (easybugtong.txt)
     - Converts each line into a usable question object
  ===================================================== */
    async function loadRiddles() {
      try {
        const res = await fetch("easybugtong.txt");    // fetch file from server
        if (!res.ok) throw new Error("Cannot load easybugtong.txt");  // if file not found, throw error
    
        const text = await res.text();                 // convert file into plain text  
        
        // split into lines and clean empty ones
        let lines = text
          .split("\n")                                 // break per line
          .map(l => l.trim())                          // remove spaces
          .filter(l => l.includes("|"));               // only valid lines 

        // convert each line into object
        let parsed = lines.map(line => {
          let parts = line.split("|").map(p => p.trim());  // split using "|" separator

          // return structured object
          return {
            q: parts[0] || "",                        // question
            a: (parts[1] || "").toLowerCase(),        // answer
            category: parts[2] || "Unknown",          // hint category
            length: parts[3] || "?",                  // hint length
            firstLetter: parts[4] || "?"              // hint first letter  
          };
        });
    
        // randomize order (shuffle riddles)
        parsed = parsed.sort(() => Math.random() - 0.5);
         // take only first 3 riddles
        riddles = parsed.slice(0, 3);    
        // mark all as unsolved
        solved = new Array(riddles.length).fill(false);
        // assign to UI cards
        assignRiddlesToCards();
    
      } catch (err) {
        console.error(err);
        alert("Failed to load easybugtong.txt");
      }
    }
    
  /* =====================================================
   3. ASSIGN RIDDLES TO CARDS
   - Displays riddles on UI cards
  ===================================================== */
    function assignRiddlesToCards() {
      // get all card elements
      let cards = document.getElementsByClassName("card");
      // loop through 3 cards
      for (let i = 0; i < 3; i++) {
        if (riddles[i]) {
          cards[i].innerText = "Bugtong " + (i + 1);    // show label
          cards[i].dataset.index = i;        // store index in card (important for click detection)
        } else {
          cards[i].innerText = "Loading...";
        }
      }
    }
    
    
  /* =====================================================
     4. CARD SYSTEM
     - Opens modal when user clicks a card
  ===================================================== */
    function openCard(cardElement) {
      // get index from clicked card
      let index = cardElement.dataset.index;
      hintsVisible = false;                                  // reset hint state
    
      if (index === undefined || !riddles[index]) return;    // safety check
    
      currentIndex = index;                      // set current question index
    
      document.getElementById("modal").style.display = "flex";  // show modal
    
      // reset UI inside modal
      document.getElementById("bigTitle").innerText = "BUGTONG";
      document.getElementById("question").innerText = riddles[index].q;
      document.getElementById("answer").value = "";
      document.getElementById("feedback").innerText = "";
      document.getElementById("hints").innerHTML = "";
    }
    
    
    /* refresh card text (not always used) */
    function updateCards() {
      let cards = document.getElementsByClassName("card");
    
      for (let i = 0; i < 3; i++) {
        cards[i].innerText = riddles[i]
          ? "Bugtong " + (i + 1)
          : "Loading...";
      }
    }
    
   /* =====================================================
     5. HINT SYSTEM
     - toggles hints on/off
  ===================================================== */
    function showHints() {
      let r = riddles[currentIndex];                      // current riddle
      let hintsBox = document.getElementById("hints");

      // if already visible → hide it
      if (hintsVisible) {
        hintsBox.innerHTML = "";
        hintsVisible = false;
      } else {
        // show hints
        hintsBox.innerHTML = `
          <div class="hint-row">
            <span>Category: ${r.category}</span>
            <span>Length: ${r.length}</span>
            <span>First Letter: ${r.firstLetter}</span>
          </div>
        `;
        hintsVisible = true;
      }
    }
    
  /* =====================================================
     6. ANSWER SYSTEM
     - checks if player answer is correct
  ===================================================== */
    function submitAnswer() {
      let user = document.getElementById("answer")       // get user input
        .value.toLowerCase()
        .trim();

      // correct answer check
      if (user === riddles[currentIndex].a) {
        solved[currentIndex] = true;
        // mark card as solved
        document.getElementsByClassName("card")[currentIndex]
          .classList.add("done");
    
        document.getElementById("feedback").innerText = "✔ Tama!";
        checkWin();
    
      } else {
        document.getElementById("feedback").innerText = "✖ Subukan muli!";
      }
    }
    
   /* =====================================================
     7. WIN CHECK SYSTEM
     - checks if all riddles are solved
  ===================================================== */
    function checkWin() {
      if (mysterySolved) return;

      // check if ALL solved = true
      if (solved.every(v => v)) {
        mysterySolved = true;
        timerRunning = false;

        // increase score
        mysteryScore++;          
        document.getElementById("scoreText").innerText =
          "Mystery: " + mysteryScore;

        // get image box
        const box = document.querySelector(".mystery-box");

        // change background image to revealed one
        box.style.backgroundImage = `url('${
          mysteryImage.startsWith("pic/")
            ? mysteryImage
            : "pic/" + mysteryImage
        }')`;
    
        box.style.backgroundSize = "cover";
        box.style.backgroundPosition = "center";
        box.style.cursor = "pointer";

         // update text
        document.getElementById("mysteryText").innerHTML =
          `Mystery Revealed<br>
           <span class="mystery-note">Click image for more info!</span>`;
    
        // next or finish game logic
        if (mysteryScore >= totalMysteries) {
          document.getElementById("nextGameBtn").style.display = "none";
    
          document.getElementById("mysteryText").innerHTML =
            `🏆 Game Completed!<br>
             <span class="mystery-note">You unlocked all 33 mystery images!</span>`;
        } else {
          document.getElementById("nextGameBtn").style.display = "block";
        }
      }
    }
        
    /* =====================================================
       8. MODAL CONTROLS
    ===================================================== */
    /* close question modal */
    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }
    
    /* =====================================================
       9. NAVIGATION
    ===================================================== */
    /* go back to home page */
    function goHome() {
      window.location.href = "index.html";
    }
    /* restart page */
    function restart() {
      location.reload();
    }
    
    /* =====================================================
       10. TIMER SYSTEM
    ===================================================== */
    let timerInterval = setInterval(() => {
      if (!timerRunning) return;
    
      let m = Math.floor(time / 60);
      let s = time % 60;
    
      document.getElementById("timer").innerText =
        `${m}:${s.toString().padStart(2, "0")}`;
    
      time--;
    
      if (time < 0) {
        clearInterval(timerInterval);
        document.getElementById("failScreen").style.display = "flex";
      }
    }, 1000);
    
    
    /* =====================================================
       11. START GAME
    ===================================================== */
    /* run when page loads */
    window.onload = async function () {
      console.log("Game starting...");
    
      await loadMystery();
      await loadRiddles();
    
      assignRiddlesToCards();
    
      console.log("Game ready!");
    };
    
    
    /* =====================================================
       12. RESTART GAME STATE (PLAY AGAIN)
    ===================================================== */
    function playAgain() {
      solved = [];
      usedMysteries = [];
      currentIndex = 0;
      currentMysteryIndex = 0;
      mysteryScore = 0;
      mysterySolved = false;
    
      document.getElementById("scoreText").innerText = "Mystery: 0";
    
      document.querySelectorAll(".card").forEach(c => c.classList.remove("done"));
    
      document.querySelector(".mystery-box").style.backgroundImage =
        "url('pic/mysterynobg.png')";
    
      document.getElementById("mysteryText").innerHTML =
        `🔒 Mystery Image Locked<br>Solve 3 bugtong to reveal!`;
    
      time = 180;
      timerRunning = true;
    
      loadRiddles();
    
      document.getElementById("nextGameBtn").style.display = "none";
    }
    
    
    /* =====================================================
       13. NEXT MYSTERY GAME
    ===================================================== */
    async function nextGame() {
      mysterySolved = false;
      currentMysteryIndex++;
      await loadMystery();
    
      solved = [];
      currentIndex = 0;
    
      document.querySelectorAll(".card").forEach(c => c.classList.remove("done"));
    
      document.getElementById("nextGameBtn").style.display = "none";
    
      document.querySelector(".mystery-box").style.backgroundImage =
        "url('pic/mysterynobg.png')";
    
      document.getElementById("mysteryText").innerHTML =
        `🔒 Mystery Image Locked<br>Solve 3 bugtong to reveal!`;
    
      time = 180;
      timerRunning = true;
    
      await loadRiddles();
    }
    
    
    /* =====================================================
       14. MYSTERY INFO SYSTEM
    ===================================================== */
    async function openInfo() {
      if (!mysterySolved) return;
    
      try {
        const res = await fetch("pic/" + mysteryInfo);
        const text = await res.text();
    
        document.getElementById("infoText").innerText = text;
        document.getElementById("infoModal").style.display = "flex";
    
      } catch (err) {
        document.getElementById("infoText").innerText =
          "Failed to load info file.";
        document.getElementById("infoModal").style.display = "flex";
      }
    }
    
    function closeInfoModal() {
      document.getElementById("infoModal").style.display = "none";
    }
    
    
    /* =====================================================
       15. LOAD MYSTERY DATA
    ===================================================== */
    async function loadMystery() {
      try {
        const res = await fetch("pic/mysterylist.txt");
    
        if (!res.ok) {
          throw new Error("Cannot load mysterylist.txt");
        }
    
        const text = await res.text();
    
        const list = text
          .split("\n")
          .map(l => l.trim())
          .filter(l => l.includes("|"))
          .map(line => {
            let parts = line.split("|").map(p => p.trim());
    
            return {
              img: parts[1] || "",
              info: parts[2] || ""
            };
          })
          .filter(item => item.img && item.info);
    
        if (currentMysteryIndex >= list.length) {
          currentMysteryIndex = list.length - 1;
        }
    
        mysteryImage = list[currentMysteryIndex].img;
        mysteryInfo = list[currentMysteryIndex].info;
    
        console.log(
          "Mystery selected:",
          currentMysteryIndex,
          mysteryImage
        );
    
      } catch (err) {
        console.error("❌ Mystery load failed:", err);
      }
    }
  </script>    
</body>
</html>
