<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tuklas Mode - Alitaptap</title>

<style>
  body {
    margin: 0;
    font-family: Georgia, serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    color: white;
  
    background-image: url("pic/tuklaspagebg.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 0;
  }

  .top-bar,
  .mystery-container,
  .cards,
  .modal,
  .fail-screen {
    position: relative;
    z-index: 2;
  }
  
  /* ===== TOP BAR ===== */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
  }

  .home-btn {
    background: #ffffff;
    color: #182848;
    border: none;
    padding: 10px 14px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
  }

  .timer {
    background: rgba(255,255,255,0.95);
    color: #182848;
    padding: 10px 18px;
    border-radius: 10px;
    font-weight: bold;
    font-size: 1.1rem;
  }

  /* ===== MYSTERY BOX ===== */
  .mystery-container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .mystery-box {
    width: 380px;
    height: 240px;
    border-radius: 15px;
  
    background-image: url("pic/mysterynobg.png");
    background-size: contain;   /* IMPORTANT CHANGE */
    background-position: center;
    background-repeat: no-repeat;
  
    border: 3px dashed rgba(255,255,255,0.8);
  
    display: flex;
    justify-content: center;
    align-items: center;
  
    position: relative;
    overflow: hidden;
  }
  
  /* ===== CARDS ===== */
  .cards {
    display: flex;
    justify-content: space-around;
    padding: 20px;
    background: rgba(255,255,255,0.1);
  }

  .card {
    width: 120px;
    height: 90px;
    background: #ffe08a;
    color: #2b2b2b;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    font-size: 1rem;
  }

  .card.done {
    background: #8affb3;
  }

  /* ===== MODAL ===== */
  .modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    display: none;
    justify-content: center;
    align-items: center;
  }

  .modal-content {
    background: white;
    color: #182848;
    padding: 25px;
    border-radius: 15px;
    width: 85%;
    max-width: 420px;
    text-align: center;
  }

  input {
    width: 90%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 10px;
    font-size: 1rem;
  }

  button {
    margin-top: 12px;
    padding: 12px 16px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: #4b6cb7;
    color: white;
    font-weight: bold;
  }

  /* ===== FAIL SCREEN ===== */
  .fail-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    display: none;
    justify-content: center;
    align-items: center;
  }

  .fail-box {
    background: white;
    color: #182848;
    padding: 30px;
    border-radius: 15px;
    text-align: center;
    width: 80%;
    max-width: 400px;
  }

  .fail-box h2 {
    margin-bottom: 10px;
  }

  .fail-buttons button {
    margin: 10px 5px 0 5px;
  }

  .hint-row {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  
  .hint-row span {
    background: #f2f2f2;
    color: #182848;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 0.9rem;
  }

  .mystery-instruction {
    text-align: center;
    font-size: 1.2rem;
    font-weight: bold;
    margin-bottom: 12px;
    color: white;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
  }
  
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
  <button class="home-btn" onclick="goHome()">🏠 Home</button>
  <div class="timer" id="timer">03:00</div>
</div>

<!-- MYSTERY BOX -->
<div class="mystery-container">
  <div class="mystery-instruction">
    🔒 Mystery Image Locked<br>
    Solve 3 bugtong to reveal!
  </div>
  
  <div class="mystery-box"></div>
</div>

<!-- CARDS -->
<div class="cards">
  <div class="card" onclick="openCard(this)">Card 1</div>
  <div class="card" onclick="openCard(this)">Card 2</div>
  <div class="card" onclick="openCard(this)">Card 3</div>
</div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="closeModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">

    <div id="bigTitle" style="font-size:28px; font-weight:bold; margin-bottom:10px;">
      BUGTONG
    </div>

    <div id="question" style="margin-bottom:15px;"></div>

    <button onclick="showHints()">Show Hints</button>

    <div id="hints" style="margin-top:10px;"></div>

    <input type="text" id="answer" placeholder="Ilagay ang sagot..." />

    <button onclick="submitAnswer()">Submit</button>

    <div id="feedback"></div>

  </div>
</div>

<!-- FAIL SCREEN -->
<div class="fail-screen" id="failScreen">
  <div class="fail-box">
    <h2>⏳ Time’s Up!</h2>
    <p>
      Hindi mo na natapos ang lahat, pero ayos lang!<br><br>
      Ibig sabihin nito ay marami ka pang dapat matutunan at tuklasin.
    </p>

    <div class="fail-buttons">
      <button onclick="goHome()">🏠 Home</button>
      <button onclick="restart()">🔄 Play Again</button>
    </div>
  </div>
</div>

<script>
  let riddles = [];
  let currentIndex = 0;
  let solved = [];
  
  /* ===== LOAD BUGTONG FROM TXT ===== */
  async function loadRiddles() {
    try {
      const res = await fetch("easybugtong.txt");
  
      if (!res.ok) {
        throw new Error("Cannot load easybugtong.txt");
      }
  
      const text = await res.text();
  
      let lines = text
        .split("\n")
        .map(l => l.trim())
        .filter(l => l.includes("|"));
  
      let parsed = lines.map(line => {
        let parts = line.split("|").map(p => p.trim());
      
        return {
          q: parts[0] || "",
          a: (parts[1] || "").toLowerCase(),
          category: parts[2] || "Unknown",
          length: parts[3] || "?",
          firstLetter: parts[4] || "?"
        };
      });
  
      parsed = parsed.sort(() => Math.random() - 0.5);
  
      riddles = parsed.slice(0, 3);
  
      console.log("Loaded riddles:", riddles);

      solved = new Array(riddles.length).fill(false); 
      
      if (riddles.length < 3) {
        alert("Not enough bugtong in file!");
      }
  
      assignRiddlesToCards(); 
  
    } catch (err) {
      console.error("Error loading bugtong:", err);
      alert("Failed to load easybugtong.txt");
    }
  }

  function assignRiddlesToCards() {
    let cards = document.getElementsByClassName("card");
  
    for (let i = 0; i < 3; i++) {
      if (riddles[i]) {
        cards[i].innerText = "Bugtong " + (i + 1);
        cards[i].dataset.index = i; 
      } else {
        cards[i].innerText = "Loading...";
      }
    }
  }
            
  /* ===== CARD SYSTEM ===== */
  function openCard(cardElement) {
    let index = cardElement.dataset.index;
    hintsVisible = false;
    
    if (index === undefined || !riddles[index]) return;
  
    currentIndex = index;
  
    document.getElementById("modal").style.display = "flex";
  
    // reset UI each open
    document.getElementById("bigTitle").innerText = "BUGTONG";
    document.getElementById("question").innerText = riddles[index].q;
    document.getElementById("answer").value = "";
    document.getElementById("feedback").innerText = "";
    document.getElementById("hints").innerHTML = "";
    
  }
  
  function updateCards() {
    let cards = document.getElementsByClassName("card");
  
    for (let i = 0; i < 3; i++) {
      cards[i].innerText = riddles[i]
        ? ("Bugtong " + (i + 1))
        : "Loading...";
    }
  }

  
  let hintsVisible = false;
  function showHints() {
    let r = riddles[currentIndex];
    let hintsBox = document.getElementById("hints");
  
    if (hintsVisible) {
      // HIDE hints
      hintsBox.innerHTML = "";
      hintsVisible = false;
    } else {
      // SHOW hints
      hintsBox.innerHTML = `
        <div class="hint-row">
          <span>Category: ${r.category}</span>
          <span>Length: ${r.length}</span>
          <span>First Letter: ${r.firstLetter}</span>
        </div>
      `;
      hintsVisible = true;
    }
  }
  
  function submitAnswer() {
    let user = document
      .getElementById("answer")
      .value.toLowerCase()
      .trim();
  
    if (user === riddles[currentIndex].a) {
      solved[currentIndex] = true;
      document.getElementsByClassName("card")[currentIndex]
        .classList.add("done");
  
      document.getElementById("feedback").innerText = "✔ Tama!";
      checkWin();
    } else {
      document.getElementById("feedback").innerText = "✖ Subukan muli!";
    }
  }
  
  function checkWin() {
    if (solved.every(v => v)) {
      document.querySelector(".mystery-box").innerText =
        "✨ Mystery Revealed!";
    }
  }
  
  /* ===== MODAL CLOSE ===== */
  function closeModal(e) {
    document.getElementById("modal").style.display = "none";
  }
  
  /* ===== NAVIGATION ===== */
  function goHome() {
    window.location.href = "index.html";
  }
  
  function restart() {
    location.reload();
  }
  
  /* ===== TIMER ===== */
  let time = 180;
  
  let timerInterval = setInterval(() => {
    let m = Math.floor(time / 60);
    let s = time % 60;
  
    document.getElementById("timer").innerText =
      `${m}:${s.toString().padStart(2, "0")}`;
  
    time--;
  
    if (time < 0) {
      clearInterval(timerInterval);
      document.getElementById("failScreen").style.display = "flex";
    }
  }, 1000);
  
  /* ===== START GAME ===== */
  window.onload = async function () {
    await loadRiddles();
  
    // wait 100ms to ensure data is stable
    setTimeout(() => {
      assignRiddlesToCards();
    }, 100);
  };
  
</script>

</body>
</html>
