<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Tuklas Mode - Alitaptap</title>
    
    <style>
    
    /* =====================================================
       1. GLOBAL PAGE LAYOUT + BACKGROUND
       (Sets full screen layout and background image)
    ===================================================== */
    body {
      margin: 0;
      font-family: Georgia, serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      color: white;
    
      background-image: url("pic/tuklaspagebg.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    
    /* Dark overlay for readability */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 0;
    }
    
    /* Ensure main UI appears above overlay */
    .top-bar,
    .mystery-container,
    .cards,
    .modal,
    .fail-screen {
      position: relative;
      z-index: 2;
    }
    
    
    /* =====================================================
       2. TOP BAR (HOME, TIMER, SCORE)
       (Navigation and game status display)
    ===================================================== */
    
    .top-bar {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      padding: 15px;
    }
    
    .left-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    /* Shared style for buttons and info boxes */
    .home-btn,
    .timer {
      font-family: Georgia, serif;
      font-size: 1rem;
      font-weight: bold;
    
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    
      padding: 0 14px;
      border-radius: 10px;
      box-sizing: border-box;
    }
    
    /* Home / action buttons */
    .home-btn {
      background: #ffffff;
      color: #182848;
      border: none;
      cursor: pointer;
    }
    
    /* Timer and score display */
    .timer {
      background: rgba(255,255,255,0.95);
      color: #182848;
    }
    
    
    /* =====================================================
       3. MYSTERY SECTION (MAIN GAME AREA)
       (Displays locked/unlocked mystery image)
    ===================================================== */
    
    .mystery-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }
    
    /* The locked/unlocked image box */
    .mystery-box {
      width: 380px;
      height: 240px;
      border-radius: 15px;
    
      background-image: url("pic/mysterynobg.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    
      border: 3px dashed rgba(255,255,255,0.8);
    
      display: flex;
      justify-content: center;
      align-items: center;
    
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    
    .mystery-box:hover {
      transform: scale(1.02);
    }
    
    /* Instruction text above mystery box */
    .mystery-instruction {
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 12px;
      color: white;
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }
    
    /* Small note text */
    .mystery-note {
      font-size: 0.85rem;
      font-weight: normal;
      opacity: 0.85;
    }
    
    
    /* =====================================================
       4. CARD SECTION (BUGTONG SELECTION)
       (User selects riddles from cards)
    ===================================================== */
    
    .cards {
      display: flex;
      justify-content: space-around;
      padding: 20px;
      background: rgba(255,255,255,0.1);
    }
    
    /* Individual card */
    .card {
      width: 120px;
      height: 90px;
      background: #ffe08a;
      color: #2b2b2b;
    
      display: flex;
      justify-content: center;
      align-items: center;
    
      border-radius: 12px;
      cursor: pointer;
    
      font-weight: bold;
      font-size: 1rem;
    }
    
    /* Card when solved */
    .card.done {
      background: #8affb3;
    }
    
    
    /* =====================================================
       5. MODAL (BUGTONG QUESTION POPUP)
       (Answer input and hints system)
    ===================================================== */
    
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
    
      display: none;
      justify-content: center;
      align-items: center;
    }
    
    .modal-content {
      background: white;
      color: #182848;
    
      padding: 25px;
      border-radius: 15px;
    
      width: 85%;
      max-width: 420px;
      text-align: center;
    }
    
    input {
      width: 90%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      font-size: 1rem;
    }
    
    button {
      margin-top: 0;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    
      background: #4b6cb7;
      color: white;
      font-weight: bold;
    }
    
    /* Hint display layout */
    .hint-row {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    
    .hint-row span {
      background: #f2f2f2;
      color: #182848;
    
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    
    
    /* =====================================================
       6. FAIL SCREEN (TIME'S UP SCREEN)
       (Shown when timer ends)
    ===================================================== */
    
    .fail-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
    
      display: none;
      justify-content: center;
      align-items: center;
    }
    
    .fail-box {
      background: white;
      color: #182848;
    
      padding: 30px;
      border-radius: 15px;
    
      text-align: center;
      width: 80%;
      max-width: 400px;
    }
    
    .fail-box h2 {
      margin-bottom: 10px;
    }
    
    .fail-buttons button {
      margin: 10px 5px 0 5px;
    }
    
    </style>
  </head>

<body>
  <!-- =====================================================
     1. TOP BAR (NAVIGATION + GAME STATUS)
     - Home button
     - Restart button
     - Timer display
     - Score display
  ===================================================== -->
  <div class="top-bar">
    <div class="left-controls">
      <button class="home-btn" onclick="goHome()">Home</button>
      <button class="home-btn" onclick="playAgain()">Play Again</button>
      <div class="timer" id="timer">03:00</div>
      <div id="scoreText" class="timer">Mystery: 0</div>
    </div>
  </div>
  
  
  <!-- =====================================================
     2. MYSTERY SECTION (MAIN GAME OBJECTIVE)
     - Instruction text
     - Mystery image box
     - Next game button
     - Game completed message
  ===================================================== -->
  <div class="mystery-container">
  
    <!-- Instruction / status message -->
    <div class="mystery-instruction" id="mysteryText">
      🔒 Mystery Image Locked<br>
      Solve 3 bugtong to reveal!
    </div>
  
    <!-- Clickable mystery image area -->
    <div class="mystery-box" onclick="openInfo()"></div>
  
    <!-- Button shown after solving current mystery -->
    <button
      id="nextGameBtn"
      class="home-btn"
      onclick="nextGame()"
      style="display:none;">
      ➡ Next Game
    </button>
  
    <!-- Final completion message -->
    <div
      id="gameFinishedText"
      class="home-btn"
      style="display:none;
             cursor:default;
             margin-top:10px;
             pointer-events:none;
             background:#ffffff;">
      Game Finished! All Mysteries Unlocked!
    </div>
  
  </div>
  
  
  <!-- =====================================================
     3. BUGTONG CARDS (PUZZLE SELECTION)
     - Player chooses which riddle to solve
  ===================================================== -->
  <div class="cards">
    <div class="card" onclick="openCard(this)">Card 1</div>
    <div class="card" onclick="openCard(this)">Card 2</div>
    <div class="card" onclick="openCard(this)">Card 3</div>
  </div>
  
  
  <!-- =====================================================
     4. BUGTONG MODAL (QUESTION POPUP)
     - Shows riddle question
     - Input answer field
     - Hints system
     - Submit button
  ===================================================== -->
  <div class="modal" id="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
  
      <!-- Title -->
      <div id="bigTitle" style="font-size:28px; font-weight:bold; margin-bottom:10px;">
        BUGTONG
      </div>
  
      <!-- Question text -->
      <div id="question" style="margin-bottom:15px;"></div>
  
      <!-- Hints button -->
      <button onclick="showHints()">Show Hints</button>
  
      <!-- Hint output area -->
      <div id="hints" style="margin-top:10px;"></div>
  
      <!-- Answer input -->
      <input type="text" id="answer" placeholder="Ilagay ang sagot..." />
  
      <!-- Submit answer -->
      <button onclick="submitAnswer()">Submit</button>
  
      <!-- Feedback (correct / wrong) -->
      <div id="feedback"></div>
  
    </div>
  </div>
  
  
  <!-- =====================================================
     5. FAIL SCREEN (TIME'S UP)
     - Shown when timer reaches 0
     - Shows restart or home options
  ===================================================== -->
  <div class="fail-screen" id="failScreen">
    <div class="fail-box">
  
      <h2>⏳ Time’s Up!</h2>
  
      <p>
        Hindi mo na natapos ang lahat, pero ayos lang!<br><br>
        Ibig sabihin nito ay marami ka pang dapat matutunan at tuklasin.
      </p>
  
      <div class="fail-buttons">
        <button onclick="goHome()">🏠 Home</button>
        <button onclick="restart()">Play Again</button>
      </div>
  
    </div>
  </div>
  
  
  <!-- =====================================================
     6. INFO MODAL (MYSTERY DETAILS)
     - Shows extra info after solving mystery
  ===================================================== -->
  <div class="modal" id="infoModal" onclick="closeInfoModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
  
      <!-- Title -->
      <h2 id="infoTitle">Information</h2>
  
      <!-- Loaded info text -->
      <div id="infoText" style="text-align:left; white-space:pre-line;"></div>
  
      <!-- Close button -->
      <button onclick="closeInfoModal()">Close</button>
  
    </div>
  </div>
  
  <script>
    /* =====================================================
       1. GAME STATE VARIABLES
       - Stores all runtime game data
    ===================================================== */
    let riddles = [];
    let currentIndex = 0;
    let solved = [];
    
    let mysteryImage = "";
    let mysteryInfo = "";
    let currentMysteryIndex = 0; // current mystery in sequence
    let mysteryScore = 0;
    let mysterySolved = false;
    let totalMysteries = 2;      //change to 33
    
    let hintsVisible = false;
    
    let time = 180;
    let timerRunning = true;
    
    
    /* =====================================================
       2. LOAD BUGTONG (RIDDLES DATA)
       - Reads text file and converts into game questions
    ===================================================== */
    async function loadRiddles() {
      try {
        const res = await fetch("easybugtong.txt");
        if (!res.ok) throw new Error("Cannot load easybugtong.txt");
    
        const text = await res.text();
    
        let lines = text
          .split("\n")
          .map(l => l.trim())
          .filter(l => l.includes("|"));
    
        let parsed = lines.map(line => {
          let parts = line.split("|").map(p => p.trim());
    
          return {
            q: parts[0] || "",
            a: (parts[1] || "").toLowerCase(),
            category: parts[2] || "Unknown",
            length: parts[3] || "?",
            firstLetter: parts[4] || "?"
          };
        });
    
        // shuffle riddles
        parsed = parsed.sort(() => Math.random() - 0.5);
    
        riddles = parsed.slice(0, 3);
        solved = new Array(riddles.length).fill(false);
    
        assignRiddlesToCards();
    
      } catch (err) {
        console.error(err);
        alert("Failed to load easybugtong.txt");
      }
    }
    
    
    /* =====================================================
       3. ASSIGN RIDDLES TO CARDS (UI SETUP)
    ===================================================== */
    function assignRiddlesToCards() {
      let cards = document.getElementsByClassName("card");
    
      for (let i = 0; i < 3; i++) {
        if (riddles[i]) {
          cards[i].innerText = "Bugtong " + (i + 1);
          cards[i].dataset.index = i;
        } else {
          cards[i].innerText = "Loading...";
        }
      }
    }
    
    
    /* =====================================================
       4. CARD SYSTEM (OPEN QUESTION MODAL)
    ===================================================== */
    function openCard(cardElement) {
      let index = cardElement.dataset.index;
      hintsVisible = false;
    
      if (index === undefined || !riddles[index]) return;
    
      currentIndex = index;
    
      document.getElementById("modal").style.display = "flex";
    
      // reset modal UI
      document.getElementById("bigTitle").innerText = "BUGTONG";
      document.getElementById("question").innerText = riddles[index].q;
      document.getElementById("answer").value = "";
      document.getElementById("feedback").innerText = "";
      document.getElementById("hints").innerHTML = "";
    }
    
    
    /* Optional: refresh card display */
    function updateCards() {
      let cards = document.getElementsByClassName("card");
    
      for (let i = 0; i < 3; i++) {
        cards[i].innerText = riddles[i]
          ? "Bugtong " + (i + 1)
          : "Loading...";
      }
    }
    
    
    /* =====================================================
       5. HINT SYSTEM
       - Toggle show/hide hints
    ===================================================== */
    function showHints() {
      let r = riddles[currentIndex];
      let hintsBox = document.getElementById("hints");
    
      if (hintsVisible) {
        hintsBox.innerHTML = "";
        hintsVisible = false;
      } else {
        hintsBox.innerHTML = `
          <div class="hint-row">
            <span>Category: ${r.category}</span>
            <span>Length: ${r.length}</span>
            <span>First Letter: ${r.firstLetter}</span>
          </div>
        `;
        hintsVisible = true;
      }
    }
    
    
    /* =====================================================
       6. ANSWER CHECKING SYSTEM
    ===================================================== */
    function submitAnswer() {
      let user = document.getElementById("answer")
        .value.toLowerCase()
        .trim();
    
      if (user === riddles[currentIndex].a) {
        solved[currentIndex] = true;
    
        document.getElementsByClassName("card")[currentIndex]
          .classList.add("done");
    
        document.getElementById("feedback").innerText = "✔ Tama!";
        checkWin();
    
      } else {
        document.getElementById("feedback").innerText = "✖ Subukan muli!";
      }
    }
    
    
    /* =====================================================
       7. WIN CHECK (MYSTERY REVEAL LOGIC)
    ===================================================== */
    function checkWin() {
      if (mysterySolved) return;
    
      if (solved.every(v => v)) {
        mysterySolved = true;
        timerRunning = false;
    
        mysteryScore++;
        document.getElementById("scoreText").innerText =
          "Mystery: " + mysteryScore;
    
        const box = document.querySelector(".mystery-box");
    
        box.style.backgroundImage = `url('${
          mysteryImage.startsWith("pic/")
            ? mysteryImage
            : "pic/" + mysteryImage
        }')`;
    
        box.style.backgroundSize = "cover";
        box.style.backgroundPosition = "center";
        box.style.cursor = "pointer";
    
        document.getElementById("mysteryText").innerHTML =
          `Mystery Revealed<br>
           <span class="mystery-note">Click image for more info!</span>`;
    
        // next or finish game logic
        if (mysteryScore >= totalMysteries) {
          document.getElementById("nextGameBtn").style.display = "none";
          document.getElementById("gameFinishedText").style.display = "block";
    
          document.getElementById("mysteryText").innerHTML =
            `🏆 Game Completed!<br>
             <span class="mystery-note">You unlocked all 33 mystery images!</span>`;
        } else {
          document.getElementById("nextGameBtn").style.display = "block";
        }
      }
    }
    
    
    /* =====================================================
       8. MODAL CONTROLS
    ===================================================== */
    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }
    
    
    /* =====================================================
       9. NAVIGATION
    ===================================================== */
    function goHome() {
      window.location.href = "index.html";
    }
    
    function restart() {
      location.reload();
    }
    
    
    /* =====================================================
       10. TIMER SYSTEM
    ===================================================== */
    let timerInterval = setInterval(() => {
      if (!timerRunning) return;
    
      let m = Math.floor(time / 60);
      let s = time % 60;
    
      document.getElementById("timer").innerText =
        `${m}:${s.toString().padStart(2, "0")}`;
    
      time--;
    
      if (time < 0) {
        clearInterval(timerInterval);
        document.getElementById("failScreen").style.display = "flex";
      }
    }, 1000);
    
    
    /* =====================================================
       11. START GAME
    ===================================================== */
    window.onload = async function () {
      console.log("Game starting...");
    
      await loadMystery();
      await loadRiddles();
    
      assignRiddlesToCards();
    
      console.log("Game ready!");
    };
    
    
    /* =====================================================
       12. RESTART GAME STATE (PLAY AGAIN)
    ===================================================== */
    function playAgain() {
      solved = [];
      usedMysteries = [];
      currentIndex = 0;
      currentMysteryIndex = 0;
      mysteryScore = 0;
      mysterySolved = false;
    
      document.getElementById("scoreText").innerText = "Mystery: 0";
    
      document.querySelectorAll(".card").forEach(c => c.classList.remove("done"));
    
      document.querySelector(".mystery-box").style.backgroundImage =
        "url('pic/mysterynobg.png')";

      document.querySelector(".mystery-box").style.cursor = "default";
      
      document.getElementById("mysteryText").innerHTML =
        `🔒 Mystery Image Locked<br>Solve 3 bugtong to reveal!`;
    
      time = 180;
      timerRunning = true;
    
      loadRiddles();
    
      document.getElementById("nextGameBtn").style.display = "none";
      document.getElementById("gameFinishedText").style.display = "none";
    }
    
    
    /* =====================================================
       13. NEXT MYSTERY GAME
    ===================================================== */
    async function nextGame() {
      mysterySolved = false;
      currentMysteryIndex++;
      await loadMystery();
    
      solved = [];
      currentIndex = 0;
    
      document.querySelectorAll(".card").forEach(c => c.classList.remove("done"));
    
      document.getElementById("nextGameBtn").style.display = "none";
      document.getElementById("gameFinishedText").style.display = "none";
    
      document.querySelector(".mystery-box").style.backgroundImage =
        "url('pic/mysterynobg.png')";

      document.querySelector(".mystery-box").style.cursor = "default";
      
      document.getElementById("mysteryText").innerHTML =
        `🔒 Mystery Image Locked<br>Solve 3 bugtong to reveal!`;
    
      time = 180;
      timerRunning = true;
    
      await loadRiddles();
    }
    
    
    /* =====================================================
       14. MYSTERY INFO SYSTEM
    ===================================================== */
    async function openInfo() {
      // Only allow opening after mystery is revealed
      if (!mysterySolved) return;
    
      try {
        const res = await fetch("pic/" + mysteryInfo);
        const text = await res.text();
    
        document.getElementById("infoText").innerText = text;
        document.getElementById("infoModal").style.display = "flex";
    
      } catch (err) {
        document.getElementById("infoText").innerText =
          "Failed to load info file.";
        document.getElementById("infoModal").style.display = "flex";
      }
    }
    
    function closeInfoModal() {
      document.getElementById("infoModal").style.display = "none";
    }
    
    
    /* =====================================================
       15. LOAD MYSTERY DATA
    ===================================================== */
    async function loadMystery() {
      try {
        const res = await fetch("pic/mysterylist.txt");
    
        if (!res.ok) {
          throw new Error("Cannot load mysterylist.txt");
        }
    
        const text = await res.text();
    
        const list = text
          .split("\n")
          .map(l => l.trim())
          .filter(l => l.includes("|"))
          .map(line => {
            let parts = line.split("|").map(p => p.trim());
    
            return {
              img: parts[1] || "",
              info: parts[2] || ""
            };
          })
          .filter(item => item.img && item.info);
    
        if (currentMysteryIndex >= list.length) {
          currentMysteryIndex = list.length - 1;
        }
    
        mysteryImage = list[currentMysteryIndex].img;
        mysteryInfo = list[currentMysteryIndex].info;
    
        console.log(
          "Mystery selected:",
          currentMysteryIndex,
          mysteryImage
        );
    
      } catch (err) {
        console.error("❌ Mystery load failed:", err);
      }
    }
  </script>    
</body>
</html>
