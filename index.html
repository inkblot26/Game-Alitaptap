<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Alitaptap</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: Georgia, serif;
    
      background-image: url("pic/homepage.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* ===== SKY ===== */
    .sky {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top, #3b4f7a, #0b1020);
    }

    /* stars */
    .sky::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(white 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.2;
    }

    /* ===== HILL ===== */
    .hill {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 40%;
      background: linear-gradient(to top, #1f4d2e, #2f6b3f);
      border-top-left-radius: 60% 100%;
      border-top-right-radius: 60% 100%;
    }

    /* ===== BAMBOO HOUSE ===== */
    .house {
      position: absolute;
      bottom: 18%;
      left: 20%;
      width: 120px;
      height: 90px;
      background: #c8a46b;
      border-radius: 6px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
    }

    .roof {
      position: absolute;
      bottom: 26%;
      left: 18%;
      width: 140px;
      height: 40px;
      background: #6b4f2a;
      transform: skewX(-10deg);
    }

    /* ===== CENTER CONTENT ===== */
    .center {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 3;
      color: white;
    }

    h1 {
      font-size: 3rem;
      margin: 0;
      letter-spacing: 4px;
      color: #e8ffe8;
    }

    .tagline {
      font-size: 0.9rem;
      color: #cfe3cf;
      margin-bottom: 20px;
    }

    /* ===== FIREFLY ===== */
    .firefly {
      width: 18px;
      height: 18px;
      background: #ffd86b;
      border-radius: 50%;
      margin: 15px auto 25px auto;
      box-shadow:
        0 0 10px #ffd86b,
        0 0 20px #ffd86b,
        0 0 40px #fff3b0;
      animation: glow 2s infinite ease-in-out;
    }

    @keyframes glow {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.4); opacity: 1; }
    }

    /* ===== MENU ===== */
    .menu button {
      display: block;
      width: 220px;
      margin: 10px auto;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: rgba(255,255,255,0.15);
      color: white;
      font-size: 1rem;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: 0.2s;
    }

    .menu button:hover {
      background: rgba(255,255,255,0.25);
      transform: scale(1.05);
    }

    .quote {
      margin-top: 15px;
      font-size: 0.8rem;
      color: #d0e6d0;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 0;
    }
    
    .center {
      z-index: 2;
    }

  </style>
</head>

<body>

  <div class="center">

    <h1>ALITAPTAP</h1>

    <div class="tagline">
      A Filipino story-driven riddle adventure
    </div>

    <div class="firefly"></div>

    <div class="menu">
      <button onclick="start('lakbay')">🚶 Lakbay Mode</button>
      <button onclick="start('tuklas')">🧠 Tuklas Mode</button>
    </div>

    <div class="quote">
      “Follow the light through forgotten riddles.”
    </div>

  </div>

  <script>
    function start(mode) {
      if (mode === "lakbay") {
        window.location.href = "lakbay.html";
      } else {
        window.location.href = "tuklas.html";
      }
    }
  </script>

</body>
</html>
