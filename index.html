<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Alitaptap</title>

  <style>
    /* ===== BASIC RESET ===== */
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: Georgia, serif;
      background: black;
    }

    /* ===== FOREST BACKGROUND ===== */
    .forest {
      position: absolute;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(ellipse at bottom, #0b1a10 0%, #020403 70%),
        linear-gradient(to top, #050805, #0b1a10);
    }

    /* subtle fog */
    .fog {
      position: absolute;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.05), transparent 60%);
      animation: drift 12s infinite linear;
      opacity: 0.4;
    }

    @keyframes drift {
      0% { transform: translate(-20%, -20%); }
      50% { transform: translate(-10%, -10%); }
      100% { transform: translate(-20%, -20%); }
    }

    /* ===== CENTER CONTENT ===== */
    .center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: white;
      z-index: 2;
    }

    h1 {
      font-size: 3rem;
      letter-spacing: 4px;
      margin-bottom: 10px;
      color: #dfffe0;
    }

    .tagline {
      font-size: 0.9rem;
      color: #b8c7b8;
      margin-bottom: 20px;
    }

    /* ===== FIREFLY ===== */
    .firefly {
      width: 18px;
      height: 18px;
      background: #ffd86b;
      border-radius: 50%;
      margin: 0 auto 25px auto;
      box-shadow:
        0 0 10px #ffd86b,
        0 0 20px #ffd86b,
        0 0 40px #ffef9a;
      animation: glow 2s infinite ease-in-out;
    }

    @keyframes glow {
      0%, 100% {
        transform: scale(1);
        opacity: 0.8;
      }
      50% {
        transform: scale(1.3);
        opacity: 1;
      }
    }

    /* ===== MENU ===== */
    .menu button {
      display: block;
      width: 220px;
      margin: 10px auto;
      padding: 12px;
      border: 1px solid #2d3b2d;
      background: rgba(10, 20, 10, 0.6);
      color: #e6f5e6;
      font-size: 1rem;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .menu button:hover {
      background: rgba(30, 60, 30, 0.8);
      transform: scale(1.05);
    }

    .quote {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #9fb59f;
    }

  </style>
</head>

<body>

  <div class="forest"></div>
  <div class="fog"></div>

  <div class="center">

    <h1>ALITAPTAP</h1>

    <div class="tagline">
      A Filipino story-driven riddle adventure
    </div>

    <!-- glowing firefly centerpiece -->
    <div class="firefly"></div>

    <div class="menu">
      <button onclick="start('lakbay')">🚶 Lakbay Mode</button>
      <button onclick="start('tuklas')">🧠 Tuklas Mode</button>
    </div>

    <div class="quote">
      “Follow the light through forgotten riddles.”
    </div>

  </div>

  <script>
    function start(mode) {
      if (mode === "lakbay") {
        window.location.href = "lakbay.html";
      } else if (mode === "tuklas") {
        window.location.href = "tuklas.html";
      }
    }
  </script>

</body>
</html>
